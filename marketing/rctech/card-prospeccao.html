<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#f3f8f8;font-family:"Inter","Helvetica Neue",Arial,sans-serif;color:#0b1220;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;background-image:radial-gradient(#cfdede 2px,transparent 2px);background-size:36px 36px;opacity:.6}
.wrap{position:absolute;inset:110px 110px 110px 120px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:18px;font-size:34px;font-weight:700}
.logo{width:62px;height:62px;border-radius:14px;background:#0b1220;color:#19b39a;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.brand span{color:#11998a}
.kicker{margin-top:56px;font-size:28px;letter-spacing:6px;font-weight:700;color:#11998a}
h1{margin-top:28px;font-size:96px;line-height:1.02;font-weight:900;letter-spacing:-3px}
h1 em{font-style:normal;color:#11998a}
.chips{margin-top:54px;display:flex;flex-wrap:wrap;gap:16px}
.chip{background:#fff;border:2px solid #d5e4e4;border-radius:999px;padding:14px 26px;font-size:32px;font-weight:600}
.steps{margin-top:56px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.step{background:#0b1220;color:#fff;border-radius:22px;padding:0 28px;font-size:32px;font-weight:700;display:flex;gap:16px;align-items:center;height:110px}
.step b{color:#19b39a;font-size:40px}
.foot{margin-top:48px;white-space:nowrap;display:flex;justify-content:space-between;font-size:30px;font-weight:600;color:#44545a}
.foot strong{color:#0b1220}
</style></head><body><div class="grid"></div><div class="wrap">
<div class="brand"><div class="logo">&lt;/&gt;</div>RcTECH <span>Digital</span></div>
<div class="kicker">RADAR DE LEADS · PROSPECÇÃO B2B</div>
<h1>Cliente em <em>qualquer segmento.</em> No mapa.</h1>
<div class="chips"><div class="chip">Restaurantes</div><div class="chip">Clínicas</div><div class="chip">Construtoras</div><div class="chip">Oficinas</div><div class="chip">Indústrias</div><div class="chip">+ o seu nicho</div></div>
<div class="steps"><div class="step"><b>1</b>Segmento</div><div class="step"><b>2</b>Região</div><div class="step"><b>3</b>Porte</div><div class="step"><b>4</b>Potencial de compra</div></div>
<div class="foot"><span>Comente <strong>RADAR</strong> e veja seu nicho no mapa</span><span>@rctech_ia</span></div>
</div></body></html>
